name: Keep Render services warm

# Render's free tier spins a service down after ~15 minutes idle, costing the
# next real request a 10-20s cold start. Pinging every 10 minutes on GitHub's
# own infra keeps both services warm independent of any laptop being on.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping aml-analytics-service
        run: |
          curl -sS -o /dev/null -w "analytics-service: %{http_code}\n" --max-time 30 https://aml-analytics-service.onrender.com/login
      - name: Ping aml-model-backend
        run: |
          curl -sS -o /dev/null -w "model-backend: %{http_code}\n" --max-time 30 https://aml-model-backend.onrender.com/health
