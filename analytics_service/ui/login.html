<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | AML Analytics</title><link rel="stylesheet" href="/ui/styles.css"><script defer src="/ui/login.js"></script></head>
<body>
  <header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">A</span> AML Analytics</div><span class="badge">SYNTHETIC DATA</span></header>
  <main class="login-main"><section class="login-heading"><p class="eyebrow">FINANCIAL CRIME INTELLIGENCE</p><h1>Sign in</h1></section>
    <form id="login-form" class="login-form"><div><label for="username">Username</label><input id="username" name="username" autocomplete="username" maxlength="40" required autofocus></div><div><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required></div><button id="sign-in" type="submit">Sign in</button></form>
    <div id="message" role="status" aria-live="polite"></div>
    <section class="demo-logins" aria-labelledby="demo-logins-title"><h2 id="demo-logins-title">Demo logins</h2><p>Read-only roles on synthetic data. Copy a password, or fill the form with one click.</p>
      <div class="demo-wrap"><table><thead><tr><th scope="col">Username</th><th scope="col">Password</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead><tbody id="demo-logins-body"></tbody></table></div>
    </section>
    <footer><span>Authorized users only</span><span>Local demonstration</span></footer>
  </main>
</body></html>
