<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AML Platform API</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.29.1/swagger-ui.css">
<style>
  :root{
    --bg:#f5f7fa; --surface:#ffffff; --surface-raised:#ffffff; --border:#dde3ea;
    --text:#131a24; --text-dim:#5c6b7d; --text-faint:#8894a2;
    --accent:#1f5fae; --accent-soft:#e8f0fc; --accent-ink:#0f3d78;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'IBM Plex Sans', system-ui, sans-serif;
    color-scheme: light;
  }
  *{box-sizing:border-box}
  html,body{margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:var(--sans);}
  .page{max-width:1180px; margin:0 auto; padding-inline:20px;}

  header.top{ border-bottom:1px solid var(--border); background:var(--surface); padding-block:22px 18px; }
  .eyebrow{ font-family:var(--mono); font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--accent); margin:0 0 8px; }
  h1{font-size:26px; font-weight:700; margin:0 0 6px; letter-spacing:-0.01em;}
  .sub{color:var(--text-dim); font-size:14.5px; max-width:66ch; line-height:1.5; margin:0 0 18px;}

  nav.switcher{ display:flex; gap:6px; margin-top:16px; border-bottom:1px solid var(--border); }
  nav.switcher button{
    font-family:var(--sans); font-size:13.5px; font-weight:600; color:var(--text-dim);
    background:none; border:none; padding:10px 4px; margin-right:22px; cursor:pointer;
    border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .12s ease, border-color .12s ease;
  }
  nav.switcher button .count{ font-family:var(--mono); font-weight:500; color:var(--text-faint); margin-left:6px; font-size:11.5px; }
  nav.switcher button:hover{color:var(--text)}
  nav.switcher button[aria-selected="true"]{color:var(--accent); border-bottom-color:var(--accent)}
  nav.switcher button[aria-selected="true"] .count{color:var(--accent)}

  .service-note{ font-size:12.5px; color:var(--text-faint); padding-block:10px 0; max-width:70ch; line-height:1.5; }
  #swagger-ui{ padding-block:8px 40px; }

  .swagger-ui{ font-family:var(--sans) !important; color:var(--text); }
  .swagger-ui .topbar{ display:none; }
  .swagger-ui, .swagger-ui .scheme-container{ background:transparent; box-shadow:none; }
  .swagger-ui .info{ margin:18px 0 10px; }
  .swagger-ui .info .title{ color:var(--text); }
  .swagger-ui .info .title small{ background:var(--accent); }
  .swagger-ui .info li, .swagger-ui .info p, .swagger-ui .info table{ color:var(--text-dim); }
  .swagger-ui a.nostyle, .swagger-ui a{ color:var(--accent); }
  .swagger-ui .scheme-container{ padding:0; margin:0 0 18px; }
  .swagger-ui select{ background:var(--surface); color:var(--text); border:1px solid var(--border); font-family:var(--mono); }
  .swagger-ui .opblock-tag{ color:var(--text); border-bottom:1px solid var(--border); font-family:var(--sans); }
  .swagger-ui .opblock-tag small{ color:var(--text-faint); }
  .swagger-ui .opblock{ background:var(--surface); border:1px solid var(--border); box-shadow:none; border-radius:8px; }
  .swagger-ui .opblock .opblock-summary{ border-color:var(--border); }
  .swagger-ui .opblock .opblock-summary-description{ color:var(--text-dim); }
  .swagger-ui .opblock .opblock-summary-path, .swagger-ui .opblock .opblock-summary-path__deprecated{ color:var(--text); font-family:var(--mono); }
  .swagger-ui .opblock.opblock-get{ background:var(--accent-soft); border-color:var(--accent); }
  .swagger-ui .opblock.opblock-get .opblock-summary-method{ background:var(--accent); }
  .swagger-ui .opblock-body pre.microlight, .swagger-ui .highlight-code{ background:var(--surface-raised) !important; color:var(--text) !important; font-family:var(--mono); }
  .swagger-ui .model-box, .swagger-ui section.models{ background:var(--surface); border-color:var(--border); }
  .swagger-ui section.models{ border:1px solid var(--border); }
  .swagger-ui section.models .model-container{ background:var(--surface-raised); }
  .swagger-ui .model, .swagger-ui .model-title, .swagger-ui table thead tr td, .swagger-ui table thead tr th{ color:var(--text-dim); }
  .swagger-ui .parameter__name, .swagger-ui .parameter__type, .swagger-ui td.parameters-col_name{ color:var(--text); font-family:var(--mono); }
  .swagger-ui .response-col_status{ color:var(--text); }
  .swagger-ui .opblock-description-wrapper p, .swagger-ui .opblock-external-docs-wrapper p, .swagger-ui .markdown p{ color:var(--text-dim); }
</style>
</head>
<body>
<header class="top">
  <div class="page">
    <p class="eyebrow">API Reference</p>
    <h1>AML Platform API</h1>
    <p class="sub">Two deployed services, documented together: an internal SQL-generation model service, and the public analytics product that calls it. Every endpoint below is the real, current contract &mdash; request/response shapes, auth, and status codes.</p>
    <nav class="switcher" role="tablist" aria-label="Choose a service">
      <button type="button" role="tab" data-service="analytics" aria-selected="true">Analytics Service <span class="count">9 endpoints</span></button>
      <button type="button" role="tab" data-service="model" aria-selected="false">Model Service <span class="count">2 endpoints</span></button>
    </nav>
  </div>
</header>
<div class="page"><p class="service-note" id="service-note"></p></div>
<div class="page"><div id="swagger-ui"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.29.1/swagger-ui-bundle.js"></script>
<script>
  var SPECS = {
    analytics: {
      spec: {
  "openapi": "3.0.3",
  "info": {
    "title": "AML Analytics",
    "version": "0.1.0",
    "description": "The deployed product: role-based login, a BigQuery-backed natural-language query dashboard, and per-user query history/saved questions. Every /query call generates SQL via the model service, validates it against schema/resource/function rules, rewrites table references to the caller's authorized views, and executes it against BigQuery under a scan budget."
  },
  "servers": [
    {
      "url": "https://aml-analytics-service.onrender.com",
      "description": "Production"
    },
    {
      "url": "http://127.0.0.1:8012",
      "description": "Local"
    }
  ],
  "tags": [
    {
      "name": "UI",
      "description": "Server-rendered HTML pages for the dashboard."
    },
    {
      "name": "Auth",
      "description": "Session/login endpoints."
    },
    {
      "name": "Query",
      "description": "The core question-answering endpoint."
    },
    {
      "name": "Workspace",
      "description": "Per-user saved questions and query history."
    },
    {
      "name": "Meta",
      "description": "Health, status and catalog metadata."
    }
  ],
  "components": {
    "securitySchemes": {
      "SessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "aml_session",
        "description": "HttpOnly, SameSite=Strict session cookie set by POST /auth/login, valid 1 hour. Used by the browser dashboard."
      },
      "BearerToken": {
        "type": "http",
        "scheme": "bearer",
        "description": "Static per-identity bearer token, for non-browser/API callers."
      }
    },
    "schemas": {
      "Login": {
        "type": "object",
        "required": [
          "username",
          "password"
        ],
        "properties": {
          "username": {
            "type": "string",
            "minLength": 1,
            "maxLength": 40
          },
          "password": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          }
        }
      },
      "Country": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string",
            "example": "GB"
          },
          "name": {
            "type": "string",
            "example": "United Kingdom"
          },
          "entity": {
            "type": "string",
            "example": "HSBC"
          }
        }
      },
      "Profile": {
        "type": "object",
        "properties": {
          "username": {
            "type": "string"
          },
          "role": {
            "type": "string",
            "enum": [
              "monitoring",
              "investigation",
              "admin"
            ]
          },
          "tables": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "countries": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Country"
            }
          },
          "read_only": {
            "type": "boolean",
            "example": true
          }
        }
      },
      "Question": {
        "type": "object",
        "required": [
          "question"
        ],
        "properties": {
          "question": {
            "type": "string",
            "minLength": 1,
            "maxLength": 2000
          }
        }
      },
      "SavedQuestion": {
        "allOf": [
          {
            "$ref": "#/components/schemas/Question"
          },
          {
            "type": "object",
            "properties": {
              "saved": {
                "type": "boolean",
                "default": true
              }
            }
          }
        ]
      },
      "WorkspaceHistoryEntry": {
        "type": "object",
        "properties": {
          "question": {
            "type": "string"
          },
          "outcome": {
            "type": "string",
            "enum": [
              "completed",
              "not_completed"
            ]
          },
          "created": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "WorkspaceFrequentEntry": {
        "type": "object",
        "properties": {
          "question": {
            "type": "string"
          },
          "count": {
            "type": "integer"
          }
        }
      },
      "Workspace": {
        "type": "object",
        "properties": {
          "history": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/WorkspaceHistoryEntry"
            },
            "description": "Last 100 queries for this identity: question, completion status, timestamp -- never SQL or result rows."
          },
          "frequent": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/WorkspaceFrequentEntry"
            }
          },
          "saved": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "description": "Up to 50 saved FAQ questions."
          }
        }
      },
      "Column": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string"
          },
          "type": {
            "type": "string"
          },
          "mode": {
            "type": "string",
            "default": "NULLABLE"
          }
        }
      },
      "Dashboard": {
        "type": "object",
        "properties": {
          "state": {
            "type": "string",
            "enum": [
              "empty",
              "partial",
              "complete"
            ]
          },
          "charts": {
            "type": "array",
            "items": {
              "type": "object"
            }
          },
          "insights": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        }
      },
      "QueryResponse": {
        "type": "object",
        "properties": {
          "request_id": {
            "type": "string",
            "format": "uuid"
          },
          "job_id": {
            "type": "string"
          },
          "metric": {
            "type": "string",
            "description": "A known KPI id, or \"exploration\" for a freeform question."
          },
          "question": {
            "type": "string"
          },
          "semantic_validation": {
            "type": "string",
            "enum": [
              "reviewed_template",
              "schema_and_policy_only"
            ]
          },
          "columns": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Column"
            }
          },
          "rows": {
            "type": "array",
            "items": {
              "type": "object"
            }
          },
          "sql": {
            "type": "string"
          },
          "schema_version": {
            "type": "string"
          },
          "scope": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "units": {
            "type": "object",
            "additionalProperties": {
              "type": "string"
            }
          },
          "data_as_of": {
            "type": "string",
            "format": "date-time"
          },
          "timezone": {
            "type": "string",
            "example": "UTC"
          },
          "synthetic": {
            "type": "boolean",
            "enum": [
              true
            ]
          },
          "mode": {
            "type": "string",
            "enum": [
              "bigquery",
              "offline_fixture"
            ]
          },
          "bytes_processed": {
            "type": "integer"
          },
          "truncated": {
            "type": "boolean"
          },
          "warnings": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "dashboard": {
            "$ref": "#/components/schemas/Dashboard"
          }
        }
      },
      "ModelStatus": {
        "type": "object",
        "properties": {
          "ready": {
            "type": "boolean"
          },
          "model": {
            "type": "string"
          },
          "backend": {
            "type": "string"
          },
          "schema_backend": {
            "type": "string"
          }
        }
      },
      "BigQueryStatus": {
        "type": "object",
        "properties": {
          "ready": {
            "type": "boolean"
          },
          "approved_views": {
            "type": "integer"
          },
          "message": {
            "type": "string"
          }
        }
      },
      "StatusResponse": {
        "type": "object",
        "properties": {
          "mode": {
            "type": "string",
            "example": "bigquery"
          },
          "query_mode": {
            "type": "string",
            "enum": [
              "freeform",
              "reviewed"
            ]
          },
          "project": {
            "type": "string"
          },
          "dataset": {
            "type": "string"
          },
          "location": {
            "type": "string"
          },
          "scope": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "profile": {
            "$ref": "#/components/schemas/Profile"
          },
          "schema_version": {
            "type": "string"
          },
          "model": {
            "$ref": "#/components/schemas/ModelStatus"
          },
          "bigquery": {
            "$ref": "#/components/schemas/BigQueryStatus"
          }
        }
      },
      "MetricSummary": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "question": {
            "type": "string"
          },
          "units": {
            "type": "string"
          }
        }
      },
      "MetricsResponse": {
        "type": "object",
        "properties": {
          "scope": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "schema_version": {
            "type": "string"
          },
          "mode": {
            "type": "string"
          },
          "questions": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/MetricSummary"
            }
          }
        }
      },
      "AnalyticsHealth": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "example": "ok"
          },
          "checks": {
            "type": "string",
            "example": "process only; not model or BigQuery readiness"
          }
        }
      },
      "Error": {
        "type": "object",
        "properties": {
          "request_id": {
            "type": "string",
            "format": "uuid"
          },
          "error": {
            "type": "object",
            "properties": {
              "code": {
                "type": "string",
                "enum": [
                  "unauthorized",
                  "csrf",
                  "request_too_large",
                  "rate_limit",
                  "busy",
                  "invalid_request",
                  "resource_denied",
                  "clarification_required",
                  "model_rejected",
                  "model_timeout",
                  "model_unavailable",
                  "model_response",
                  "internal_error"
                ]
              },
              "message": {
                "type": "string"
              }
            }
          }
        }
      }
    }
  },
  "paths": {
    "/login": {
      "get": {
        "tags": [
          "UI"
        ],
        "summary": "Login page",
        "description": "Serves the sign-in HTML page, or redirects to /ui/ if already signed in.",
        "responses": {
          "200": {
            "description": "Login page (HTML)"
          },
          "307": {
            "description": "Already signed in; redirected to /ui/"
          }
        }
      }
    },
    "/profile": {
      "get": {
        "tags": [
          "UI"
        ],
        "summary": "Profile page",
        "responses": {
          "200": {
            "description": "Profile page (HTML)"
          },
          "307": {
            "description": "Not signed in; redirected to /login"
          }
        }
      }
    },
    "/ui/": {
      "get": {
        "tags": [
          "UI"
        ],
        "summary": "Analysis dashboard page",
        "responses": {
          "200": {
            "description": "Dashboard page (HTML)"
          },
          "307": {
            "description": "Not signed in; redirected to /login"
          }
        }
      }
    },
    "/auth/login": {
      "post": {
        "tags": [
          "Auth"
        ],
        "summary": "Sign in with username/password",
        "description": "On success, sets an HttpOnly, SameSite=Strict session cookie (1 hour) and returns the caller's profile.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Login"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Signed in",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Profile"
                }
              }
            }
          },
          "401": {
            "description": "Invalid credentials",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/auth/logout": {
      "post": {
        "tags": [
          "Auth"
        ],
        "summary": "Sign out",
        "description": "Revokes the current session and clears the cookie.",
        "responses": {
          "200": {
            "description": "Signed out"
          }
        }
      }
    },
    "/auth/me": {
      "get": {
        "tags": [
          "Auth"
        ],
        "summary": "Current identity",
        "security": [
          {
            "SessionCookie": []
          },
          {
            "BearerToken": []
          }
        ],
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Profile"
                }
              }
            }
          },
          "401": {
            "description": "Not signed in",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/workspace": {
      "get": {
        "tags": [
          "Workspace"
        ],
        "summary": "Get saved questions and query history",
        "security": [
          {
            "SessionCookie": []
          },
          {
            "BearerToken": []
          }
        ],
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Workspace"
                }
              }
            }
          },
          "401": {
            "description": "Not signed in",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/workspace/saved": {
      "post": {
        "tags": [
          "Workspace"
        ],
        "summary": "Save or unsave a FAQ question",
        "security": [
          {
            "SessionCookie": []
          },
          {
            "BearerToken": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SavedQuestion"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Updated workspace",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Workspace"
                }
              }
            }
          },
          "401": {
            "description": "Not signed in",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
            "description": "Empty question",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/workspace/history": {
      "delete": {
        "tags": [
          "Workspace"
        ],
        "summary": "Clear query history",
        "description": "Clears history only; saved FAQ questions are untouched.",
        "security": [
          {
            "SessionCookie": []
          },
          {
            "BearerToken": []
          }
        ],
        "responses": {
          "200": {
            "description": "Updated workspace",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Workspace"
                }
              }
            }
          },
          "401": {
            "description": "Not signed in",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/query": {
      "post": {
        "tags": [
          "Query"
        ],
        "summary": "Ask a question about the permitted AML data",
        "description": "The core endpoint. Generates SQL for the question, validates it against schema/resource/function rules, rewrites table references to the caller's authorized views, dry-runs and then executes it against BigQuery under a scan budget, and returns a dashboard-ready result. Gated by a per-identity rate limit (requests_per_minute) and a global in-flight concurrency cap (max_concurrent_queries).",
        "security": [
          {
            "SessionCookie": []
          },
          {
            "BearerToken": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Question"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/QueryResponse"
                }
              }
            }
          },
          "401": {
            "description": "Not signed in",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "The question touches a resource outside the caller's scope",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
            "description": "Invalid question, model-rejected candidate, or clarification required",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "Per-identity rate limit reached, or the service is at its concurrent-query cap",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "502": {
            "description": "The model service returned an unusable response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "504": {
            "description": "The model service timed out",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"

              }
            }
          }
        }
      }
    },
    "/health": {
      "get": {
        "tags": [
          "Meta"
        ],
        "summary": "Process liveness only",
        "description": "Does not reflect model or BigQuery readiness -- see /status for that.",
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AnalyticsHealth"
                }
              }
            }
          }
        }
      }
    },
    "/status": {
      "get": {
        "tags": [
          "Meta"
        ],
        "summary": "Authenticated model and data readiness",
        "security": [
          {
            "SessionCookie": []
          },
          {
            "BearerToken": []
          }
        ],
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/StatusResponse"
                }
              }

          },
          "401": {
            "description": "Not signed in",
            "content": {

    "/metrics": {
      "get": {

          {

        ],
        "responses": {

            "description": "OK",

              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MetricsResponse"

            "description": "Not signed in",
            "content": {

},
      note: "The public product surface: role-based login, the /query endpoint, workspace history and status/metrics metadata. This is what a browser or an external API caller talks to."
    },
    model: {
      spec: {
  "openapi": "3.0.3",
  "info": {
    "title": "AML Text-to-SQL Model Service",
    "version": "1.0.0",
    "description": "Internal-only API that turns a natural-language question into SQL: retrieves relevant tables from the knowledge graph, serializes them as DDL, prompts the model, and schema-validates the result. Not intended to be called directly by end users -- aml-analytics-service is the public product surface that calls this."
  },
  "servers": [
    {
      "url": "https://aml-model-backend.onrender.com",
      "description": "Production"
    },
    {
      "url": "http://127.0.0.1:8000",
      "description": "Local"
    }
  ],
  "tags": [
    {
      "name": "Generation",
      "description": "SQL generation from a natural-language question."
    },
    {
      "name": "Meta",
      "description": "Health and readiness."
    }
  ],
  "components": {
    "schemas": {
      "Correction": {
        "type": "object",
        "properties": {
          "from": {
            "type": "string"
          },
          "to": {
            "type": "string"
          },
          "kind": {
            "type": "string",
            "nullable": true,
            "description": "\"table\" or \"column\""
          },
          "stage": {
            "type": "string",
            "nullable": true,
            "description": "\"kg_repair\" (retrieval-scoped) or omitted for the canonical schema validator"
          }
        },
        "required": [
          "from",
          "to"
        ]
      },
      "QuestionRequest": {
        "type": "object",
        "required": [
          "question"
        ],
        "properties": {
          "question": {
            "type": "string",
            "minLength": 1,
            "maxLength": 2000,
            "description": "Natural-language question about the AML dataset."
          },
          "with_system_prompt": {
            "type": "boolean",
            "default": false,
            "description": "Prepend the business-analyst/read-only-SQL system prompt to the model input."
          },
          "top_k": {
            "type": "integer",
            "default": 6,
            "minimum": 1,
            "maximum": 20,
            "description": "Number of tables the retrieval engine selects before hop expansion."
          },
          "use_exemplars": {
            "type": "boolean",
            "default": true,
            "description": "Reuse a verified answer for (near-)duplicate known KPI questions instead of regenerating."
          },
          "ground_tables": {
            "type": "boolean",
            "default": false,
            "description": "Prepend a dynamic 'use only these exact table names' line."
          },
          "retry_on_invalid": {
            "type": "boolean",
            "default": false,
            "description": "If the first attempt fails schema validation, widen retrieval and regenerate once with the violations fed back into the prompt."
          },
          "execution_mode": {
            "type": "boolean",
            "default": false,
            "description": "Used by aml-analytics-service: emits native BigQuery types/enums directly, skipping exemplar answers and fuzzy repair."
          },
          "allowed_columns": {
            "type": "object",
            "nullable": true,
            "additionalProperties": {
              "type": "array",
              "items": {
                "type": "string"
              }
            },
            "description": "Table -> allowed column names, used with execution_mode to scope generation to the caller's authorized resources."
          }
        }
      },
      "QuestionResponse": {
        "type": "object",
        "properties": {
          "question": {
            "type": "string"
          },
          "sql": {
            "type": "string"
          },
          "source": {
            "type": "string",
            "enum": [
              "exemplar_retrieval",
              "model_generation",
              "ollama_generation"
            ]
          },
          "matched_question": {
            "type": "string",
            "nullable": true
          },
          "similarity": {
            "type": "number"
          },
          "tables_used": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "corrections": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Correction"
            }
          },
          "schema_valid": {
            "type": "boolean"
          },
          "schema_violations": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "retried": {
            "type": "boolean"
          },
          "system_prompt": {
            "type": "string",
            "nullable": true
          },
          "model_input": {
            "type": "string",
            "nullable": true
          }
        }
      },
      "ModelHealth": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "example": "ok"
          },
          "ollama_ready": {
            "type": "boolean",
            "description": "Whether the primary local model backend is reachable right now."
          },
          "generation_ready": {
            "type": "boolean",
            "description": "Whether POST /generate-sql can currently service a request at all, across every configured generation path."
          },
          "model": {
            "type": "string"
          },
          "backend": {
            "type": "string"
          },
          "schema_backend": {
            "type": "string",
            "enum": [
              "falkordb",
              "catalog",
              "auto"
            ]
          }
        }
      }
    }
  },
  "paths": {
    "/generate-sql": {
      "post": {
        "tags": [
          "Generation"
        ],
        "summary": "Generate SQL from a natural-language question",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/QuestionRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "SQL generated (and schema-validated) successfully.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/QuestionResponse"
                }
              }
            }
          },
          "503": {
            "description": "Generation unavailable; check the model service's own logs."
          }
        }
      }
    },
    "/health": {
      "get": {
        "tags": [
          "Meta"
        ],
        "summary": "Liveness and generation readiness",
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ModelHealth"
                }
              }
            }
          }
        }
      }
    }
  }
},
      note: "Internal-only text-to-SQL generation. Called by the analytics service over HTTPS; not meant to be reached directly by end users."
    }
  };

  function loadSpec(key){
    document.getElementById("service-note").textContent = SPECS[key].note;
    document.querySelectorAll("nav.switcher button").forEach(function(btn){
      btn.setAttribute("aria-selected", btn.dataset.service === key ? "true" : "false");
    });
    window.SwaggerUIBundle({
      spec: SPECS[key].spec,
      dom_id: "#swagger-ui",
      presets: [SwaggerUIBundle.presets.apis],
      layout: "BaseLayout",
      docExpansion: "list",
      defaultModelsExpandDepth: 1,
      tryItOutEnabled: false
    });
  }

  document.querySelectorAll("nav.switcher button").forEach(function(btn){
    btn.addEventListener("click", function(){ loadSpec(btn.dataset.service); });
  });

  loadSpec("analytics");
</script>
</body>
</html>
